# =============================================================================
# pii_types.toml — the judged vocabulary, mirrored from the running config
# =============================================================================
# One section per pii_type the judge is asked about. The vocabulary is the set
# of types ENABLED in pii-reporting-api/src/main/resources/data.sql that the two
# public datasets actually document. `label` is the French label production
# sends as `type_label` (ContentPiiDetection.PiiTypeLabel), so the judge sees
# the same two strings it sees in production.
#
# Types enabled in data.sql but ABSENT here, because neither dataset labels
# them — listed so the gap is on record rather than inferred from a short table:
#   TAX_ID, LICENSE_PLATE, VEHICLE_IDENTIFIER, CERTIFICATE_LICENSE_NUMBER,
#   MAC_ADDRESS, HTTP_COOKIE, DEVICE_IDENTIFIER, SOFTWARE_LICENSE,
#   CLIENT_SECRET, GITHUB_TOKEN, ACCESS_TOKEN, CRYPTO (Presidio),
#   NRP (Presidio), AVS_NUMBER (Regex).
# TAX_ID and VEHICLE_IDENTIFIER are exactly where the PCYBER judge run found the
# most noise, so their absence is the sharpest limit of this benchmark.
#
# Per-type keys
#   label        production `type_label`
#   detectors    which detector(s) emit this pii_type in data.sql
#   category     pii_type_config.category
#   gold         "<dataset>:<label>" span sources for TRUE positives
#   gold_filter  optional regex the span text must match (splits IP into v4/v6)
#   competing    "<dataset>:<label>" sources for the competing_type FP family:
#                a real value of a neighbouring type, claimed under this one.
#                A candidate is kept ONLY when the surrounding text names that
#                neighbouring type — see [rival_mentions] below for why
#   mentions     surface forms that NAME the type. Three uses: the type_mention
#                FP family takes them as spans, a true positive is tagged
#                `with_clue` when one sits within 60 characters of it, and they
#                are what qualifies a competing-type candidate
#   violations   names from [shapes] whose matches CANNOT be an instance of this
#                type. Leave empty when no shape is safely impossible
# =============================================================================

schema_version = "2"
seed_reference = "pii-reporting-api/src/main/resources/data.sql"

# -----------------------------------------------------------------------------
# [shapes] — character runs harvested from the document text for the
# format_violation family. Each one must be IMPOSSIBLE for the types that claim
# it: that is what makes the FALSE_POSITIVE label a fact about the format spec
# rather than a bet on what the dataset forgot to label.
# -----------------------------------------------------------------------------
# The lookarounds exclude \w on both sides so a run glued to a word — the "1942"
# of "mathieu.amatter1942" — is never harvested: no detector emits that, and a
# benchmark item no detector can produce measures nothing.
#
# Length bounds are the impossibility argument, one per type family:
#   digits_2_6      shorter than any social security number (9 digits at the
#                   very least, 13 for an AVS, 15 for a NIR)
#   digits_2_7      shorter than the 8-digit floor of an ISO/IEC 7812 card PAN
#   digits_4_19     an IBAN always opens with two letters, so a run of digits
#                   alone is never one, whatever its length
#   digits_7_plus   longer than any CVV, whose 3-or-4 length IS a real spec
#   digits_13_plus  longer than the 12-digit ceiling ISO 9564-1 sets for a PIN
#   digits_21_plus  longer than a card PAN (19) and than any routing number
#   upper_3_7       a BIC is exactly 8 or 11 characters
#   two_octets      two dotted groups are not an IPv4 address
#   amount_grouped  thousand separators AND a two-digit decimal part: that is a
#                   monetary amount, and no identifier of any type here carries
#                   a decimal part. The decimals are mandatory on purpose — "021
#                   000 021" is a US routing number printed in groups, not an
#                   amount, and an optional decimal part would have caught it
[shapes]
digits_2_6      = "(?<![\\w.,-])\\d{2,6}(?![\\w.,-])"
digits_2_7      = "(?<![\\w.,-])\\d{2,7}(?![\\w.,-])"
digits_4_19     = "(?<![\\w.,-])\\d{4,19}(?![\\w.,-])"
digits_7_plus   = "(?<![\\w.,-])\\d{7,}(?![\\w.,-])"
digits_13_plus  = "(?<![\\w.,-])\\d{13,}(?![\\w.,-])"
digits_21_plus  = "(?<![\\w.,-])\\d{21,}(?![\\w.,-])"
amount_grouped  = "(?<![\\w.,-])\\d{1,3}(?:[ .,]\\d{3})+[.,]\\d{2}(?![\\w.,-])"
upper_3_7       = "(?<![A-Za-z0-9])[A-Z]{3,7}(?![A-Za-z0-9])"
two_octets      = "(?<![\\w.])\\d{1,3}\\.\\d{1,3}(?![\\w.])"
dotted_date     = "(?<![\\w.])\\d{1,2}\\.\\d{1,2}\\.\\d{2,4}(?![\\w.])"
clock_time      = "(?<![\\w:])\\d{1,2}:\\d{2}(?::\\d{2})?(?![\\w:])"

# -----------------------------------------------------------------------------
# [placeholders] — masked or templated values, harvested verbatim from the text.
# Shared by every type: a masked value is a false positive whatever the claimed
# type, which is motive (c) "PAS UNE VALEUR" of the production prompt.
# -----------------------------------------------------------------------------
[placeholders]
patterns = [
    "[Xx]{3,}(?:[- ][Xx]{2,}){0,4}",
    "\\*{3,}\\d{0,4}",
    "\\$\\{[A-Za-z0-9_]{3,40}\\}",
    "\\{\\{[A-Za-z0-9_. ]{3,40}\\}\\}",
    "<[A-Za-z0-9_ -]{0,20}(?:your|votre|insert|placeholder|todo|xxx)[A-Za-z0-9_ -]{0,20}>",
    "YOUR_[A-Z0-9_]{3,40}",
    "\\b[A-Z]{2,}_(?:HERE|PLACEHOLDER|GOES_HERE)\\b",
    "\\[[A-Za-z][A-Za-z ._/-]{2,38}\\]",
]

# -----------------------------------------------------------------------------
# [rival_mentions] — surface forms that name a dataset label which no judged
# type claims as gold.
#
# Why this table has to exist. The production prompt only allows a rejection on
# motive (b) when "le contexte designe explicitement une AUTRE entite", and
# forbids rejecting for lack of context. A bare BBAN claimed as a card number is
# indistinguishable from a PAN on the value alone — Luhn is off limits — so a
# judge answering UNSURE there is RIGHT, and counting it as a miss would grade
# the judge against the opposite of the prompt it was given.
#
# So a competing-type candidate is kept only when the 60 characters around it
# name the rival. For a label some judged type owns as gold, that type's own
# `mentions` do the job. For the rest, the forms live here.
# -----------------------------------------------------------------------------
[rival_mentions]
"gretelai:customer_id"    = ["customer ID", "customer number", "client ID", "identifiant client", "numéro de client", "référence client"]
"gretelai:employee_id"    = ["employee ID", "employee number", "staff ID", "matricule", "identifiant employé", "numéro d'employé"]
"gretelai:phone_number"   = ["phone number", "telephone", "phone", "mobile number", "numéro de téléphone", "téléphone", "portable"]
"ai4privacy:TEL"          = ["phone number", "telephone", "phone", "mobile number", "numéro de téléphone", "téléphone", "portable"]
"gretelai:passport_number" = ["passport number", "passport", "numéro de passeport", "passeport"]
"ai4privacy:PASSPORT"     = ["passport number", "passport", "numéro de passeport", "passeport"]
"ai4privacy:POSTCODE"     = ["postal code", "postcode", "zip code", "code postal", "NPA"]
"ai4privacy:GEOCOORD"     = ["latitude", "longitude", "coordinates", "coordonnées", "GPS"]
"gretelai:local_latlng"   = ["latitude", "longitude", "coordinates", "coordonnées", "GPS"]
"gretelai:user_name"      = ["username", "user name", "login", "nom d'utilisateur", "identifiant de connexion"]
"ai4privacy:USERNAME"     = ["username", "user name", "login", "nom d'utilisateur", "identifiant de connexion"]
"ai4privacy:EMAIL"        = ["email address", "e-mail", "email", "adresse e-mail", "courriel"]

