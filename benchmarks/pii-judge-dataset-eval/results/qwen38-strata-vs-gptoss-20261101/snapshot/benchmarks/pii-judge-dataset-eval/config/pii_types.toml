# =============================================================================
# [rationale] — the calls a reviewer should sanity-check, written out rather
# than buried in a diff. Every competing pair below says a real value of label L
# claimed under type T is a FALSE POSITIVE **when the surrounding text names L**,
# and why that is a fact rather than an opinion. The clue requirement is not a
# detail: without it, several of these pairs would ask the judge for the opposite
# of what the production prompt orders.
# =============================================================================
[rationale]
clue_requirement = """\
Every competing-type candidate must have the rival type named within 60 \
characters. The production prompt allows motive (b) only when "le contexte \
designe explicitement une AUTRE entite" and forbids rejecting for lack of \
context; it also forbids computing a checksum. A bare BBAN claimed as a card \
number is therefore genuinely undecidable, and a judge answering UNSURE is \
right. Grading it as a miss would measure the judge against the opposite of its \
own instructions."""

bban_vs_iban = """\
A BBAN is the domestic account number; an IBAN is that number prefixed by a \
country code and two check digits. A bare BBAN claimed as an IBAN fails the \
IBAN spec outright — motive (a), no context needed. The REVERSE pair is NOT \
declared: an IBAN claimed as an account number is a MORE PRECISE form of the \
same thing, which the prompt's guardrail on motive (b) explicitly forbids \
rejecting."""

swift_vs_account = """\
A BIC is eight or eleven characters opening with four LETTERS (ISO 9362); an \
account number, a BBAN and a routing number are numeric or start with digits. \
The pair rests on that alphabet and length argument, not on "identifies the \
bank rather than the account" — a routing number identifies the bank too, so \
that phrasing refuted itself."""

cvv_vs_pin = """\
A CVV is three or four digits (a real spec); a PIN is four to twelve \
(ISO 9564-1). On the value alone the two overlap completely, which is why this \
pair only counts when the context names the rival. Without the clue requirement \
it would be undecidable, and the shapes reflect the same asymmetry: \
digits_7_plus is impossible for a CVV, only digits_13_plus is impossible for a \
PIN."""

idcard_vs_socialnumber = """\
In several jurisdictions the number printed on the identity card IS the social \
security number, so the two are not separable on the value. The pair therefore \
relies entirely on the clue requirement: it counts only where the text names \
the rival registry."""

tel_vs_socialnumber = """\
A phone number named as such in the context, claimed as a social security \
number, is the textbook numeric over-fire: same digit-count range, no shared \
semantics, and the context settles it."""

ip_vs_geocoord = """\
A latitude or longitude carries a decimal part, which no octet of an IPv4 \
address does; the sign is a further hint but not a reliable one, since many \
notations omit it. The pair also requires the context to name the coordinates."""

password_vs_api_key = """\
Both are secrets, and the production prompt explicitly forbids rejecting a \
secret for being weak or public. The pair is kept because the ROLE differs: an \
API key authenticates a program against a service, a password authenticates a \
person. A judge asked "is this a password" about something the context calls an \
API key should say no for the role, not for the strength."""

no_violations_for_secrets = """\
PASSWORD and API_KEY declare no format_violation shape, and that is deliberate: \
neither has a published specification, so no run of characters is provably \
impossible for them. Their FP quota is filled by the three other families."""

national_id_violations = """\
NATIONAL_ID and DRIVER_LICENSE_NUMBER keep only amount_grouped and clock_time. \
Short document numbers exist, national specs vary, and the production prompt \
forbids motive (a) outside certainty about the spec — a digits_2_6 shape would \
have labelled as false positive something a correct judge must leave alone."""

routing_violations = """\
BANK_ROUTING_NUMBER keeps only digits_21_plus and amount_grouped. A run of 3 to \
6 digits is a NORMAL routing number (UK sort code 6, Swiss clearing 3 to 5), \
not an impossible one, so the digits_2_6 shape was removed."""

socialnum_duplicate = """\
SOCIALNUM (Regex) and SOCIAL_SECURITY_NUMBER (Ministral) are two enabled rows \
of pii_type_config for the same concept, and production sends the judge the \
pii_type string verbatim. They are benchmarked separately on purpose: if a \
judge scores differently on the two strings, that difference is real and \
operators need to see it. Because the sampling seed is derived from the \
gold/competing signature rather than from the type name, both arms judge the \
SAME spans, so the difference is attributable to the pii_type and type_label \
strings alone. Use --type to drop one when the run budget is tight."""

card_duplicate = """\
CREDIT_CARD (Presidio) and CREDIT_DEBIT_CARD (Ministral), like IBAN_CODE and \
IBAN, are the same concept under two enabled pii_type strings with two \
different French labels. Same reasoning, same shared sampling seed, as \
socialnum_duplicate."""

password_label_covers_pin = """\
PASSWORD is seeded with the label "Mot de passe ou code PIN", so the French PIN \
surface forms are listed among its mentions. The consequence is intended: a bare \
"code PIN" phrase is a type_mention false positive for PASSWORD too, and a true \
PASSWORD next to that phrase is tagged with_clue rather than misleading_clue."""
