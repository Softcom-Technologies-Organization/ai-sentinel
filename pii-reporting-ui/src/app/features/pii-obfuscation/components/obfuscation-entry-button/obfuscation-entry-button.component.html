@if (remediationConfig.enabled()) {
  <a class="obfuscation-entry-btn"
     [class.obfuscation-entry-btn--labeled]="labeled()"
     [class.obfuscation-entry-btn--disabled]="disabled()"
     [routerLink]="disabled() ? null : ['/obfuscation']"
     [queryParams]="queryParams()"
     target="_blank"
     [attr.data-testid]="testId()"
     [attr.aria-label]="labelKey() | transloco"
     [attr.aria-disabled]="disabled() ? 'true' : null"
     [pTooltip]="disabled() ? ('dashboard.actions.noScanData' | transloco) : (labeled() ? undefined : (labelKey() | transloco))"
     tooltipPosition="top"
     (click)="$event.stopPropagation()">
    <i class="pi pi-eye-slash" aria-hidden="true"></i>
    @if (labeled()) {
      <span>{{ labelKey() | transloco }}</span>
    }
  </a>
}
